<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | Nazafarin</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <main>

        <div class="container">

            <h1>
                Welcome Back
            </h1>

            <p>
                Sign in to your Nazafarin account.
            </p>


            <form id="loginForm">

                <div>

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        required>

                </div>


                <div>

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        required>

                </div>


                <button
                    type="submit">

                    Sign In

                </button>


                <p id="loginMessage"></p>

            </form>


            <p>

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </main>


    <script src="login.js"></script>

</body>

</html>
