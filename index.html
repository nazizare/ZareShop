<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nazafarin | Online Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="container header-container">

            <!-- Logo -->
            <a href="#" class="logo">
             Nazafarin
            </a>

            <!-- Navigation -->
            <nav class="navigation">

                <a href="#">Home</a>
                <a href="#">Shop</a>
                <a href="#">Categories</a>
                <a href="#">About</a>

            </nav>

            <!-- Header Actions -->
            <div class="header-actions">

                <a href="#" class="search" aria-label="Search">
                    🔍
                </a>

                <a href="#" class="cart" aria-label="Shopping Cart">
                    🛒
                </a>

                <a href="#" class="account" aria-label="Account">
                    👤
                </a>

            </div>

        </div>

    </header>

    <!-- Main content -->
    <main>

        <!-- Hero Section -->
        <section class="hero">

            <div class="container hero-container">

                <!-- Hero Content -->
                <div class="hero-content">

                    <span class="hero-label">
                        NEW COLLECTION 2026
                    </span>

                    <h1>
                        Find Something
                        <span>You’ll Love.</span>
                    </h1>

                    <p>
                        Discover carefully selected products,
                        made to bring style and comfort to your everyday life.
                    </p>

                    <div class="hero-buttons">

                        <a href="#" class="hero-button primary-button">
                            Shop Now
                        </a>

                        <a href="#" class="hero-button secondary-button">
                            Explore Collection
                        </a>

                    </div>

                </div>


                <!-- Hero Visual -->
                <div class="hero-visual">

                    <div class="hero-image-wrapper">

                        <div class="hero-circle"></div>

                        <div class="hero-product">
                            🛍️
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
