<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Create Account | Nazafarin</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <main>

        <div class="container">

            <h1>
                Create Account
            </h1>

            <p>
                Create your Nazafarin account.
            </p>


            <form id="registerForm">

                <div>

                    <label for="firstName">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        required>

                </div>


                <div>

                    <label for="lastName">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        required>

                </div>


                <div>

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        required>

                </div>


                <div>

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        required>

                </div>


                <div>

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        minlength="8"
                        required>

                </div>


                <div>

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        minlength="8"
                        required>

                </div>


                <button
                    type="submit">

                    Create Account

                </button>


                <p id="registerMessage"></p>

            </form>


            <p>

                Already have an account?

                <a href="login.html">
                    Sign In
                </a>

            </p>

        </div>

    </main>


    <script src="register.js"></script>

</body>

</html>
