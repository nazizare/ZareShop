<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Product | Nazafarin</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <div class="navigation">

            <a href="index.html" class="logo">
                Nazafarin
            </a>

            <a href="index.html">
                Home
            </a>

            <a href="index.html#products">
                Shop
            </a>

            <a href="index.html#categories">
                Categories
            </a>

            <a href="index.html#about">
                About
            </a>

            <a href="wishlist.html" class="wishlist">
                ♡
                <span class="wishlist-count">0</span>
            </a>

            <a href="index.html" class="cart">
                🛒
            </a>

            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Open menu">

                ☰

            </button>

        </div>

    </header>

    <main class="product-page">

        <div class="container">

            <a href="index.html" class="back-link">
                ← Back to Shop
            </a>


            <div class="product-details">

                <!-- Product Image -->

                <div class="product-details-image">

                    <img
                    id="productImage"
                    src=""
                    alt="Product">

                </div>


                <!-- Product Information -->

                <div class="product-details-info">

                    <span
                        class="product-details-category"
                        id="productCategory">

                        Category

                    </span>


                    <h1 id="productName">
                        Product Name
                    </h1>


                    <p
                        class="product-details-price"
                        id="productPrice">

                        $0.00

                    </p>


                    <p
                        class="product-details-description"
                        id="productDescription">

                        Product description goes here.

                    </p>


                    <!-- Quantity -->

                    <div class="product-quantity">

                        <span>Quantity</span>

                        <div class="quantity-selector">

                            <button
                                type="button"
                                id="decreaseQuantity">

                                −

                            </button>


                            <span id="productQuantity">
                                1
                            </span>


                            <button
                                type="button"
                                id="increaseQuantity">

                                +

                            </button>

                        </div>

                    </div>


                    <button
                        type="button"
                        id="addProductToCart"
                        class="product-add-button">

                        Add to Cart

                    </button>

                </div>

            </div>

        </div>

    </main>


    <script src="product.js"></script>

</body>

</html>
