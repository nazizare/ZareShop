<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Order Details | Nazafarin</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <main class="order-details-page">

        <div class="container">

            <a
                href="my-orders.html"
                class="back-link">

                ← Back to My Orders

            </a>


            <h1>
                Order Details
            </h1>


            <div id="orderMessage"></div>


            <section class="order-details-card">

                <div class="order-details-header">

                    <div>

                        <span>
                            Order ID
                        </span>

                        <strong id="orderId">
                            -
                        </strong>

                    </div>


                    <div>

                        <span>
                            Date
                        </span>

                        <strong id="orderDate">
                            -
                        </strong>

                    </div>


                    <div>

                        <span>
                            Status
                        </span>

                        <strong id="orderStatus">
                            -
                        </strong>

                    </div>

                </div>


                <div class="order-customer-info">

                    <h2>
                        Customer Information
                    </h2>

                    <div id="customerDetails">
                        Loading...
                    </div>

                </div>


                <div class="order-shipping-info">

                    <h2>
                        Shipping Information
                    </h2>

                    <div id="shippingDetails">
                        Loading...
                    </div>

                </div>


                <div class="order-products">

                    <h2>
                        Products
                    </h2>

                    <div id="orderItems">
                        Loading...
                    </div>

                </div>


                <div class="order-total-row">

                    <span>
                        Total
                    </span>

                    <strong id="orderTotal">
                        $0.00
                    </strong>

                </div>

            </section>

        </div>

    </main>


    <script src="my-order-details.js"></script>

</body>

</html>
