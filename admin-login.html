<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Nazafarin</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <main>

        <div class="container">

            <h1>
                Admin Login
            </h1>


            <form id="adminLoginForm">

                <div>

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        required>

                </div>


                <div>

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        required>

                </div>


                <button
                    type="submit">

                    Login

                </button>


                <p id="loginMessage"></p>

            </form>

        </div>

    </main>


    <script src="admin-login.js"></script>

</body>

</html>
