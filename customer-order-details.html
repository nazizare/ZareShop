<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Order Details | Nazafarin</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <main>

        <div class="container">

            <a
                href="my-orders.html"
                class="back-link">

                ← Back to My Orders

            </a>


            <div class="customer-order-page">

                <div class="order-page-header">

                    <div>

                        <span class="order-label">
                            Order Details
                        </span>

                        <h1>
                            Order #<span id="orderId">-</span>
                        </h1>

                    </div>


                    <span
                        id="orderStatus"
                        class="order-status">

                        Loading...

                    </span>

                </div>


                <!-- Customer Information -->

                <section class="order-section">

                    <h2>
                        Customer Information
                    </h2>

                    <div id="customerDetails">

                        Loading...

                    </div>

                </section>


                <!-- Shipping Information -->

                <section class="order-section">

                    <h2>
                        Shipping Information
                    </h2>

                    <div id="shippingDetails">

                        Loading...

                    </div>

                </section>


                <!-- Ordered Products -->

                <section class="order-section">

                    <h2>
                        Ordered Products
                    </h2>

                    <div id="orderItems">

                        Loading...

                    </div>

                </section>


                <!-- Total -->

                <section class="order-total-section">

                    <span>
                        Order Total
                    </span>

                    <strong id="orderTotal">
                        $0.00
                    </strong>

                </section>

            </div>

        </div>

    </main>


    <script src="customer-order-details.js"></script>

</body>

</html>
