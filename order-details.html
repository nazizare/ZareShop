<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Order Details | Nazafarin</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <header>

        <div class="navigation">

            <a
                href="index.html"
                class="logo">

                Nazafarin

            </a>

            <a href="admin.html">
                Orders
            </a>

            <a href="index.html">
                Home
            </a>

        </div>

    </header>


    <main class="admin-page">

        <div class="container">

            <a
                href="admin.html"
                class="back-link">

                ← Back to Orders

            </a>


            <div class="section-header">

                <span class="section-label">
                    ADMIN PANEL
                </span>

                <h1>
                    Order Details
                </h1>

            </div>


            <!-- Customer Information -->

            <section class="admin-order-section">

                <h2>
                    Customer
                </h2>

                <div id="customerDetails">

                    Loading...

                </div>

            </section>


            <!-- Shipping Information -->

            <section class="admin-order-section">

                <h2>
                    Shipping Information
                </h2>

                <div id="shippingDetails">

                    Loading...

                </div>

            </section>


            <!-- Products -->

            <section class="admin-order-section">

                <h2>
                    Products
                </h2>

                <div
                    id="orderItems">

                    Loading...

                </div>

            </section>


            <!-- Total -->

            <section class="admin-order-total">

                <span>
                    Total
                </span>

                <strong id="orderTotal">
                    $0.00
                </strong>

            </section>

            <section class="admin-order-section">

                <h2>
                    Order Status
                </h2>

                <div class="order-status-control">

                    <select id="orderStatus">

                        <option value="pending">
                            Pending
                        </option>

                        <option value="processing">
                            Processing
                        </option>

                        <option value="shipped">
                            Shipped
                        </option>

                        <option value="delivered">
                            Delivered
                        </option>

                        <option value="cancelled">
                            Cancelled
                        </option>

                    </select>


                    <button
                        type="button"
                        id="saveStatusButton">

                        Save Status

                    </button>

                </div>

            </section>            

        </div>

    </main>


    <script src="order-details.js"></script>

</body>

</html>
